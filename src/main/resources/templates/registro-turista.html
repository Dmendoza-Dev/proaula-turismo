<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de turista | Cayo Cartagena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="icon" type="image/png" href="/img/logo.png">
</head>

<body class="login-body">
    <main class="login-page registro-page">

        <section class="login-panel login-form-panel">
            <div class="login-card registro-card">
                <a href="/" class="login-marca">
                    <img src="/img/logo.png" alt="Logo Cayo Cartagena" class="puerto">
                    <span>Cayo Cartagena</span>
                </a>
                <h1 class="login-titulo">Crea tu cuenta de turista</h1>
                <p class="login-sub">
                    ¿Ya tienes cuenta?
                    <a href="/login">Iniciar sesión</a>
                </p>

                <form action="/registro" method="POST" novalidate>
                    <input type="hidden" name="tipoUsuario" value="CLIENTE">

                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label" for="nombres">Nombres y apellidos</label>
                            <input class="form-control login-input" type="text" id="nombres" name="nombres"
                                placeholder="Como aparece en tu documento" autocomplete="name" required />
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label" for="documento">Documento</label>
                            <input class="form-control login-input" type="text" id="documento" name="documento"
                                placeholder="Número de documento" inputmode="numeric" required />
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label" for="telefono">Teléfono</label>
                            <input class="form-control login-input" type="tel" id="telefono" name="telefono"
                                placeholder="300 000 0000" autocomplete="tel" required />
                        </div>

                        <div class="col-12">
                            <label class="form-label" for="correo">Correo electrónico</label>
                            <input class="form-control login-input" type="email" id="correo" name="correo"
                                placeholder="tucorreo@ejemplo.com" autocomplete="email" required />
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label" for="password">Contraseña</label>
                            <div class="login-password">
                                <input class="form-control login-input" type="password" id="password" name="contrasena" placeholder="Crea una contraseña" autocomplete="new-password" required />
                                <button type="button" class="login-ver" data-objetivo="password"
                                    aria-label="Mostrar contraseña">Mostrar</button>
                            </div>
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label" for="confirmar">Confirmar contraseña</label>
                            <div class="login-password">
                                <input class="form-control login-input" type="password" id="confirmar"
                                    placeholder="Repite la contraseña" autocomplete="new-password" required />
                                <button type="button" class="login-ver" data-objetivo="confirmar"
                                    aria-label="Mostrar contraseña">Mostrar</button>
                            </div>
                        </div>

                        <div class="col-12">
                            <p class="registro-ayuda" id="ayudaPassword">
                                Usa al menos 8 caracteres, con letras y números.
                            </p>
                        </div>

                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="terminos" required>
                                <label class="form-check-label" for="terminos">
                                    Acepto los <a href="/terminos" class="login-enlace">términos de uso</a> y el
                                    <a href="/privacidad" class="login-enlace">tratamiento de datos personales</a>.
                                </label>
                            </div>
                        </div>

                        <div class="col-12">
                            <button class="btn btn-isla w-100" type="submit">Crear cuenta</button>
                        </div>
                    </div>
                </form>

                <p class="login-nota">
                    Te enviaremos un correo para verificar tu cuenta antes de que puedas iniciar sesión.
                </p>
            </div>
        </section>

        <section class="login-panel login-imagen-panel registro-imagen d-none d-lg-block">
            <div id="carruselRegistro" class="carousel slide carousel-fade h-100" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button class="active" type="button" data-bs-target="#carruselRegistro" data-bs-slide-to="0"
                        aria-current="true" aria-label="Diapositiva 1"></button>
                    <button type="button" data-bs-target="#carruselRegistro" data-bs-slide-to="1"
                        aria-label="Diapositiva 2"></button>
                    <button type="button" data-bs-target="#carruselRegistro" data-bs-slide-to="2"
                        aria-label="Diapositiva 3"></button>
                </div>

                <div class="carousel-inner h-100">
                    <div class="carousel-item active h-100">
                        <img class="login-slide" src="/img/registro-1.webp" alt="Turistas1" />
                    </div>
                    <div class="carousel-item h-100">
                        <img class="login-slide" src="/img/registro-2.webp" alt="Turistas2" />
                    </div>
                    <div class="carousel-item h-100">
                        <img class="login-slide" src="/img/registro-3.webp" alt="Turistas3" />
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('.login-ver').forEach((boton) => {
            boton.addEventListener('click', () => {
                const campo = document.getElementById(boton.dataset.objetivo);
                const oculta = campo.type === 'password';
                campo.type = oculta ? 'text' : 'password';
                boton.textContent = oculta ? 'Ocultar' : 'Mostrar';
                boton.setAttribute('aria-label', oculta ? 'Ocultar contraseña' : 'Mostrar contraseña');
            });
        });

        const pass = document.getElementById('password');
        const conf = document.getElementById('confirmar');
        const ayuda = document.getElementById('ayudaPassword');
        function revisar() {
            if (conf.value && pass.value !== conf.value) {
                ayuda.textContent = 'Las contraseñas no coinciden.';
                ayuda.classList.add('registro-error');
            } else {
                ayuda.textContent = 'Usa al menos 8 caracteres, con letras y números.';
                ayuda.classList.remove('registro-error');
            }
        }
        pass.addEventListener('input', revisar);
        conf.addEventListener('input', revisar);
    </script>
</body>

</html>
