<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Cayo Cartagena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="icon" type="image/png" href="/img/logo.png">
</head>

<body class="login-body">
    <main class="login-page">

        <section class="login-panel login-form-panel">
            <div class="login-card">
                <a href="/" class="login-marca">
                    <img src="/img/logo.png" alt="Logo Cayo Cartagena" class="puerto">
                    <span>Cayo Cartagena</span>
                </a>

                <h1 class="login-titulo">Iniciar sesión</h1>
                <p class="login-sub">
                    ¿No tienes cuenta?
                    <a href="/#como-usar">Crea una</a>
                </p>

                <form action="/login" method="POST" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="formEmail">Correo electrónico</label>
                        <input class="form-control login-input" type="email" id="formEmail" name="correo" placeholder="tucorreo@ejemplo.com" autocomplete="email" required />
                    </div>

                    <div class="mb-2">
                        <label class="form-label" for="formPassword">Contraseña</label>
                        <div class="login-password">
                            <input class="form-control login-input" type="password" id="formPassword" name="contrasena" placeholder="Tu contraseña" autocomplete="current-password" required />
                            <button type="button" class="login-ver" id="verPassword"
                                aria-label="Mostrar contraseña">Mostrar</button>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="recordarme">
                            <label class="form-check-label" for="recordarme">Recordarme</label>
                        </div>
                        <a href="/recuperar" class="login-enlace">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button class="btn btn-isla w-100" type="submit">Iniciar sesión</button>
                </form>

                <p class="login-nota">
                    Los proveedores y las agencias pueden ingresar mientras su cuenta es validada,
                    pero no podrán publicar ofertas hasta ser aprobados.
                </p>
            </div>
        </section>

        <section class="login-panel login-imagen-panel d-none d-lg-block">
            <div id="carruselLogin" class="carousel slide carousel-fade h-100" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button class="active" type="button" data-bs-target="#carruselLogin" data-bs-slide-to="0"
                        aria-current="true" aria-label="Diapositiva 1"></button>
                    <button type="button" data-bs-target="#carruselLogin" data-bs-slide-to="1"
                        aria-label="Diapositiva 2"></button>
                    <button type="button" data-bs-target="#carruselLogin" data-bs-slide-to="2"
                        aria-label="Diapositiva 3"></button>
                </div>

                <div class="carousel-inner h-100">
                    <div class="carousel-item active h-100">
                        <img class="login-slide" src="/img/login-1.webp" alt="isla1" />
                    </div>
                    <div class="carousel-item h-100">
                        <img class="login-slide" src="/img/login-2.webp" alt="isla2" />
                    </div>
                    <div class="carousel-item h-100">
                        <img class="login-slide" src="/img/login-3.webp" alt="isla3" />
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const campo = document.getElementById('formPassword');
        const boton = document.getElementById('verPassword');
        boton.addEventListener('click', () => {
            const oculta = campo.type === 'password';
            campo.type = oculta ? 'text' : 'password';
            boton.textContent = oculta ? 'Ocultar' : 'Mostrar';
            boton.setAttribute('aria-label', oculta ? 'Ocultar contraseña' : 'Mostrar contraseña');
        });
    </script>
</body>
</html>
