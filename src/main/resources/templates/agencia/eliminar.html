<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eliminar oferta | Agencia | Cayo Cartagena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/flujo.css">
</head>
<body>
    <header class="proveedor-cabecera">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-6 d-flex align-items-center gap-2">
                    <img src="/img/logo.png" alt="" width="40" class="puerto">
                    <div>
                        <h1 class="h4 mb-0">Cayo Cartagena</h1>
                        <small>Agencia de turismo</small>
                    </div>
                </div>
                <div class="col-6 text-end">
                    <div class="perfil d-inline-block">
                        <button type="button" class="perfil-boton" aria-label="Abrir menú de perfil">
                            <img src="/img/perfil-turista.svg" alt="Perfil" width="40" class="rounded-circle">
                        </button>
                        <ul class="perfil-menu">
                            <li><span class="perfil-encabezado">Mi cuenta</span></li>
                            <li><a href="/logout">Cerrar sesión</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="container py-4">
        <ul class="nav nav-pills mb-4">
            <li class="nav-item"><a class="nav-link" href="/agencia/panel">Panel</a></li>
            <li class="nav-item"><a class="nav-link active" href="/agencia/lista">Mis ofertas</a></li>
        </ul>

        <div class="row justify-content-center">
            <div class="col-12 col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h2 class="h4">Eliminar oferta</h2>
                        <p class="mt-3">¿Estás seguro de eliminar <strong th:text="|'${oferta.nombreOferta}'|">la oferta</strong>?</p>
                        <p class="text-muted" th:if="${oferta.estadoOferta != 'Cancelada'}">Esta acción no se puede deshacer. Si la oferta ya está en un itinerario, solo se retirará del catálogo.</p>
                        <form th:action="'/agencia/eliminar'" method="post">
                            <input type="hidden" name="idOferta" th:value="${oferta.idOferta}">
                            <div class="d-flex justify-content-center gap-2 mt-3">
                                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                                <a href="/agencia/panel" class="btn btn-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
