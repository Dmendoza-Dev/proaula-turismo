# Configuracion de MySQL para la PC donde se ejecute la base de datos.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/CayoCartagena?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&createDatabaseIfNotExist=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# No modificar automaticamente el esquema: se usa database/cayo_cartagena.sql.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
