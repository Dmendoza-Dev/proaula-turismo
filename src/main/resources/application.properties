spring.application.name=proaula-turismo
server.port=8080

# La aplicacion requiere MySQL: activa el perfil que contiene la conexion.
spring.profiles.active=mysql

spring.thymeleaf.cache=false

# El certificado RNT se sube como archivo; el límite por defecto es 1 MB.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
