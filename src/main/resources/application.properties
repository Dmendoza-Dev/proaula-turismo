spring.application.name=proaula-turismo
server.port=8080

# La aplicacion requiere MySQL: activa el perfil que contiene la conexion.
spring.profiles.active=mysql

spring.thymeleaf.cache=false

# El certificado RNT se sube como archivo; el limite por defecto es 1 MB.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Sesion: cookie no accesible desde JavaScript. SameSite=Lax evita que la
# sesion se pierda al entrar desde un enlace externo, sin ser tan estricto
# como para complicar las pruebas del prototipo.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Pagina de error propia; nunca se muestran trazas ni mensajes internos.
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
